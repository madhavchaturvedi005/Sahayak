name: Deploy to EC2

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 40m
          script_stop: true
          script: |
            set -euo pipefail
            cd ~/Sahayak
            git fetch origin main
            git reset --hard origin/main
            chmod +x deploy.sh incremental-sync.sh 2>/dev/null || true
            if [ ! -f deploy.sh ] && [ -f deploy-paste.sh ]; then
              cp deploy-paste.sh deploy.sh
              chmod +x deploy.sh
            fi
            SKIP_GIT_SYNC=1 ./incremental-sync.sh
