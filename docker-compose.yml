services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sahayak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sahayak}
      POSTGRES_DB: ${POSTGRES_DB:-sahayak_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - sahayak-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sahayak} -d ${POSTGRES_DB:-sahayak_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./utils:/app/utils
    ports:
      - "8001:8000"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3001}
      - JWT_SECRET=${JWT_SECRET:-change-me-to-a-long-random-string}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_REALTIME_MODEL=${OPENAI_REALTIME_MODEL:-gpt-realtime}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sahayak-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: ${FRONTEND_TARGET:-dev}
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8001}
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8001}
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - sahayak-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  sahayak-network:
    driver: bridge
